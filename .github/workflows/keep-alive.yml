name: RemunaIA Keep-Alive

on:
  schedule:
    - cron: '23 9 */2 * *'  # a cada 2 dias às 9h23 UTC
  workflow_dispatch:         # permite rodar manualmente

permissions:
  actions: write  # necessário para o workflow se reativar via API

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Impedir que o GitHub desative este workflow
        # O GitHub desativa workflows agendados após 60 dias sem commits no repo
        # (foi o que causou a pausa do Supabase em 02/10/2026). Reativar via API
        # a cada execução reinicia essa contagem sem precisar de commits.
        run: |
          curl -sf -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"
          echo "Workflow mantido ativo."

      - name: Verificar e restaurar projeto Supabase
        run: |
          # 1. Verifica status via Management API
          STATUS_PROJ=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            "https://api.supabase.com/v1/projects/hyxgcqgnpsfofddmsodi" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',''))" 2>/dev/null)
          echo "Status do projeto: $STATUS_PROJ"

          # 2. Se pausado, restaura e aguarda até 5 minutos
          if [ "$STATUS_PROJ" != "ACTIVE_HEALTHY" ]; then
            echo "Projeto pausado! Restaurando..."
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
              "https://api.supabase.com/v1/projects/hyxgcqgnpsfofddmsodi/restore"
            echo "Aguardando restauração (300s)..."
            sleep 300
          fi

          # 3. Executa query real no banco para registrar atividade
          RESULT=$(curl -s -w "\n%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            "https://hyxgcqgnpsfofddmsodi.supabase.co/rest/v1/profiles?select=count")
          HTTP_CODE=$(echo "$RESULT" | tail -1)
          BODY=$(echo "$RESULT" | head -1)
          echo "Query ao banco: HTTP $HTTP_CODE"
          echo "Resposta: $BODY"

          # 4. Falha o workflow se a query não retornou 200
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERRO: Query falhou com HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Manutenção concluída — projeto ativo."
